name: Install (download) desired version of API (if newer)

on:
  workflow_call:
    inputs:
      commit-message:
        description: Commit message for install of newer API.
        type: string
        default: 'chore: install API version'
      # Little reason to override inputs below:
      npm-registry-url:
        description: npm registry to get dependencies from
        type: string
        default: https://npm.pkg.github.com
      github-org:
        description: GitHub organization
        type: string
        default: '@statens-pensjonskasse'
      runner-tag:
        description: workflow should run on...
        type: string
        default: 'ubuntu-latest'

jobs:
  install-api:
    runs-on: ${{ inputs.runner-tag }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # node is preinstallled on ubuntu, but we need to reinstall to set up registry and org
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.1
          registry-url: ${{ inputs.npm-registry-url }}
          scope: ${{ inputs.github-org }}

      - name: Install desired version of API (if newer)
        id: build
        env:
          # litt problematisk for public repo å token med tilgang til package fra annet public repo under samme github organization
          NODE_AUTH_TOKEN: ${{ secrets.PAT_FOR_PACKAGES_ACCESS || secrets.GITHUB_TOKEN }}
        run: |
          npx --yes --package="@statens-pensjonskasse/swagger-tracker@^0.2.2" swag install
          git status
          git add -A
          # dirty=true if anything is staged for commit (modified, added or deleted files)
          if git diff --cached --quiet; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.build.outputs.dirty == 'true'
        uses: statens-pensjonskasse/gha-create-signed-commit@7b9e477ae72b66627fb37db6b841f0e31d3d965e # v0.1.5
        with:
          # GITHUB_TOKEN for commit, push, deploy - has rights to write this repo and its packages, but not rights to read org packages
          token: ${{ secrets.GITHUB_TOKEN }}
          message: ${{ inputs.commit-message }}
          fail-on-no-changes: false
          push: true
