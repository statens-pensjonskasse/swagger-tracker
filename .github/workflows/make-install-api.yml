name: Install (download) desired version of API (if newer), using make

on:
  workflow_call:
    inputs:
      commit-message:
        description: Commit message for install of newer API.
        type: string
        default: 'chore: install API version'
      # Little reason to override inputs below:
      runner-tag:
        description: workflow should run on...
        type: string
        default: 'ubuntu-latest'

jobs:
  install-api:
    runs-on: ${{ inputs.runner-tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # needs only bash, make, curl and jq - all preinstalled on ubuntu runners
      - name: Download desired version of API (if newer)
        id: build
        run: |
          make -f "Makefile" install
          git status
          git add -A
          # dirty=true if anything is staged for commit (modified, added or deleted files)
          if git diff --cached --quiet; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.build.outputs.dirty == 'true'
        uses: statens-pensjonskasse/gha-create-signed-commit@7b9e477ae72b66627fb37db6b841f0e31d3d965e # v0.1.5
        with:
          # GITHUB_TOKEN for commit, push - has rights to write this repo
          token: ${{ secrets.GITHUB_TOKEN }}
          message: ${{ inputs.commit-message }}
          fail-on-no-changes: false
          push: true
