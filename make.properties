# Settings for Makefile (swagger-tracker). Plain KEY=value, included by make.

# API on SwaggerHub
SWAG_REGISTRY=https://api.swaggerhub.com/apis/skatteetaten/inntekt-api
# Version to install, updated by `make renovate` and Renovate
SWAG_DESIRED_VERSION=1.7.0
# Downloaded specification files
SWAG_LOCAL_JSON=swagger-tracker.json
SWAG_LOCAL_YAML=swagger-tracker.yaml
